<!-- Registration Lookup                                                 -->
<!-- ═══════════════════════════════════════════════════════════════════ -->
<script>
function esc(v) {
  return String(v || '').replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]
  );
}

// ─── Client-side Cache ────────────────────────────────────────────────
const _cache = {};
async function cachedFetch(key, url) {
  if (_cache[key]) return _cache[key];
  const resp = await fetch(url);
  const data = await resp.json();
  _cache[key] = data;
  return data;
}
function clearCache() { Object.keys(_cache).forEach(k => delete _cache[k]); }

// ─── Tes Tulis Data (stored globally) ────────────────────────────────
let _tesTulisData = null;
</script>

<script>
(function() {
  const nameInput     = document.getElementById('nama');
  const classInput    = document.getElementById('kelas');
  const divisiInput   = document.getElementById('divisi');
  const box           = document.getElementById('registration-reference');
  const details       = document.getElementById('registration-details');
  const status        = document.getElementById('registration-status');
  const suggestions   = document.getElementById('nama-suggestions');
  if (!nameInput || !box || !suggestions) return;

  const FIELD_LABELS = {
    'Tempat dan Tgl. Lahir':              'Tempat & Tanggal Lahir',
    'Divisi yang dipilih':                 'Divisi Pilihan',
    'Pengalaman mengikuti organisasi':    'Pengalaman Organisasi',
    'Jabatan apa yang pernah diemban':    'Jabatan yang Pernah Diemban',
    'Mengapa ingin menjadi pengurus OSIS?': 'Alasan Ingin Jadi Pengurus OSIS',
    'Apa yang ingin anda kontribusikan untuk sekolah?': 'Kontribusi untuk Sekolah',
    'Apa yang menurutmu perlu diperbaiki dari kegiatan santri di sekolah?': 'Hal yang Perlu Diperbaiki',
    'Harapan terhadap OSIS kedepan':      'Harapan terhadap OSIS',
    'Ide Kegiatan/ Program yang ingin dikembangkan': 'Ide Kegiatan/Program',
    'KOMITMEN CALON PENGURUS OSIS':      'Komitmen Calon Pengurus OSIS'
  };

  let timer;

  function esc(v) {
    return String(v || '').replace(/[&<>"']/g, c =>
      ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]
    );
  }

  function classMatch(regVal, optVal) {
    return String(regVal).trim().toLowerCase().replace(/\s+/g,'') ===
           String(optVal).trim().toLowerCase().replace(/\s+/g,'');
  }

  async function lookup() {
    const name = nameInput.value.trim();
    if (!name) { box.hidden = true; return; }

    box.hidden = false;
    status.textContent = 'Mencari data...';
    details.innerHTML = '';

    try {
      const url = GAS_URL + '?action=getRegistration&nama=' + encodeURIComponent(name);
      const result = await cachedFetch('reg:' + name.toLowerCase(), url);

      if (!result.success) throw new Error(result.error || 'Gagal membaca data.');

      if (!result.data) {
        status.textContent = 'Data tidak ditemukan';
        return;
      }

      status.textContent = '✓ Ditemukan';
      const d = result.data;

      // Auto-fill kelas
      if (classInput) {
        const kelasVal = d['Kelas'] || '';
        if (!classInput.value && kelasVal) {
          for (const opt of classInput.options) {
            if (classMatch(kelasVal, opt.value)) { classInput.value = opt.value; break; }
          }
        }
      }

      // Auto-fill divisi
      if (divisiInput) {
        const divVal = d['Divisi yang dipilih'] || '';
        if (!divisiInput.value && divVal) {
          for (const opt of divisiInput.options) {
            if (divVal.toLowerCase().includes(opt.value.toLowerCase())) {
              divisiInput.value = opt.value; break;
            }
          }
        }
      }

      // Render detail
      let html = '';
      for (const key of Object.keys(FIELD_LABELS)) {
        const val = d[key];
        if (val && val.trim()) {
          html += '<div class="reference-item"><b>' + esc(FIELD_LABELS[key]) + '</b><span>' + esc(val) + '</span></div>';
        }
      }
      details.innerHTML = html;

      // ─── Lookup Skor Tes Tulis ──────────────────────────────────────
      const tesBox = document.getElementById('tes-tulis-info');
      const tesStatus = document.getElementById('tes-tulis-status');
      const tesDetails = document.getElementById('tes-tulis-details');
      if (tesBox) {
        tesBox.hidden = false;
        tesStatus.textContent = 'Mencari...';
        tesDetails.innerHTML = '';
        try {
          const tesUrl = GAS_URL + '?action=getTesTulis&nama=' + encodeURIComponent(name);
          const tesResult = await cachedFetch('tes:' + name.toLowerCase(), tesUrl);
          if (tesResult.success && tesResult.data && tesResult.data.nilai) {
            const t = tesResult.data;
            _tesTulisData = t;
            tesStatus.textContent = '✓ Ditemukan';
            tesDetails.innerHTML =
              '<div class="reference-item"><b>Skor PG</b><span>' + esc(t.skorPG) + ' / 60</span></div>' +
              '<div class="reference-item"><b>Skor Uraian</b><span>' + esc(t.skorUraian) + ' / 20</span></div>' +
              '<div class="reference-item"><b>Nilai Akhir</b><span><strong>' + esc(t.nilai) + ' / 100</strong></span></div>';
          } else {
            _tesTulisData = null;
            tesStatus.textContent = 'Belum ada data tes tulis';
          }
        } catch (tesErr) {
          _tesTulisData = null;
          tesStatus.textContent = '⚠ Gagal memuat data tes';
          console.error('[Lookup] Tes Tulis Error:', tesErr);
        }
      }

    } catch (err) {
      status.textContent = '⚠ Gagal terhubung';
      console.error('[Lookup] Error:', err);
    }
  }

  // ─── Autocomplete Search ─────────────────────────────────────────────
  async function searchSuggestions(query) {
    if (!query || query.length < 1) { suggestions.hidden = true; return; }
    try {
      const url = GAS_URL + '?action=searchNames&q=' + encodeURIComponent(query);
      const result = await cachedFetch('search:' + query.toLowerCase(), url);
      if (!result.success || !result.names || result.names.length === 0) {
        suggestions.hidden = true;
        return;
      }
      suggestions.innerHTML = result.names.map(n =>
        '<div class="suggestion-item">' + esc(n) + '</div>'
      ).join('');
      suggestions.hidden = false;
    } catch (err) {
      suggestions.hidden = true;
    }
  }

  // Click suggestion
  suggestions.addEventListener('mousedown', function(e) {
    const item = e.target.closest('.suggestion-item');
    if (item) {
      nameInput.value = item.textContent;
      suggestions.hidden = true;
      lookup();
    }
  });

  // Hide suggestions on blur
  nameInput.addEventListener('blur', function() {
    setTimeout(function() { suggestions.hidden = true; }, 200);
    lookup();
  });

  nameInput.addEventListener('focus', function() {
    if (suggestions.children.length > 0 && nameInput.value.length >= 1) {
      suggestions.hidden = false;
    }
  });

  // ─── Input Handler ───────────────────────────────────────────────────
  nameInput.addEventListener('input', function() {
    clearTimeout(timer);
    const val = nameInput.value.trim();
    // Show suggestions for partial input
    timer = setTimeout(function() {
      if (val.length >= 1) {
        searchSuggestions(val);
      } else {
        suggestions.hidden = true;
        box.hidden = true;
      }
    }, 300);
  });
})();
</script>

  `).join('');
}

// ─── SCORING ───────────────────────────────────────────────────────────
const scores = {};

function setSkor(questionId, skor) {
  scores[questionId] = skor;
  document.querySelectorAll(`[data-q="${questionId}"]`).forEach(btn => {
    btn.classList.toggle('active', parseInt(btn.dataset.skor) === skor);
  });
  const display = document.getElementById('display_' + questionId);
  const r = RUBRIK_SKOR.find(x => x.skor === skor);
  display.textContent = skor + ' — ' + (r ? r.label : '');
  display.classList.add('show');
}

// ─── NAVIGATION ────────────────────────────────────────────────────────
function goToStep(step) {
  if (step >= 2) {
    const n = document.getElementById('nama').value.trim();
    const k = document.getElementById('kelas').value;
    const d = document.getElementById('divisi').value;
    if (!n || !k || !d) { showToast('⚠️ Mohon lengkapi semua data kandidat terlebih dahulu.'); return; }
  }
  if (step === 4) {
    const allIds = [
      ...PERTANYAAN.map(q => q.id),
      ...STUDI_KASUS.flatMap(sk => sk.aspek.map(a => a.id))
    ];
    const missing = allIds.filter(id => !scores[id]);
    if (missing.length > 0) { showToast('⚠️ Masih ada ' + missing.length + ' aspek yang belum dinilai.'); return; }
  }

  // Update progress bar
  for (let i = 1; i <= 4; i++) {
    const prog = document.getElementById('prog-' + i);
    const line = document.getElementById('line-' + i);
    prog.classList.remove('active', 'done');
    if (i < step) { prog.classList.add('done'); }
    else if (i === step) { prog.classList.add('active'); }
    if (line) { line.classList.toggle('done', i < step); }
  }

  document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
  document.getElementById('step' + step).classList.add('active');
  if (step === 4) renderRingkasan();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ─── RINGKASAN ─────────────────────────────────────────────────────────
function renderRingkasan() {
  const c = document.getElementById('ringkasan-container');
  const nama   = document.getElementById('nama').value;
  const kelas  = document.getElementById('kelas').value;
  const divisi = document.getElementById('divisi').value;

  const qScores = PERTANYAAN.map(q => scores[q.id] || 0);
  const qAvg = (qScores.reduce((a,b) => a+b, 0) / qScores.length).toFixed(1);

  const skAverages = STUDI_KASUS.map(sk => {
    const s = sk.aspek.map(a => scores[a.id] || 0);
    return (s.reduce((a,b) => a+b, 0) / s.length).toFixed(1);
  });

  const all = [...qScores, ...STUDI_KASUS.flatMap(sk => sk.aspek.map(a => scores[a.id] || 0))];
  const rataRata = parseFloat((all.reduce((a,b) => a+b, 0) / all.length).toFixed(1));

  // Skor Tes Tulis (skala 0-100)
  const tesSkor100 = (_tesTulisData && _tesTulisData.nilai) ? parseFloat(_tesTulisData.nilai) : null;

  // Skor Akhir = (Wawancara × 0.6) + (TesTulis/100 × 10 × 0.4)
  let skorAkhir = null;
  if (tesSkor100 !== null) {
    skorAkhir = (rataRata * 0.6) + ((tesSkor100 / 100) * 10 * 0.4);
    skorAkhir = parseFloat(skorAkhir.toFixed(1));
  }

  const skorAkhirLabel = skorAkhir !== null ? skorAkhir : rataRata;
  const kategori = KATEGORI.find(k => skorAkhirLabel >= k.min && skorAkhirLabel <= k.max);

  c.innerHTML = `
    <div class="card summary-card">
      <div class="summary-header">
        <h3>${esc(nama)}</h3>
        <p>${esc(kelas)} — ${esc(divisi)}</p>
      </div>
      <div class="summary-section">
        <h4>📝 Pertanyaan Umum (Rata-rata: ${qAvg})</h4>
        <table class="summary-table">
          <thead><tr><th>Pertanyaan</th><th>Skor</th></tr></thead>
          <tbody>${PERTANYAAN.map(q => `<tr><td>${q.judul}</td><td class="skor-cell">${scores[q.id]}</td></tr>`).join('')}</tbody>
        </table>
      </div>
      ${STUDI_KASUS.map((sk, i) => `
        <div class="summary-section">
          <h4>📋 ${sk.judul} (Rata-rata: ${skAverages[i]})</h4>
          <table class="summary-table">
            <thead><tr><th>Aspek</th><th>Skor</th></tr></thead>
            <tbody>${sk.aspek.map(a => `<tr><td>${a.label}</td><td class="skor-cell">${scores[a.id]}</td></tr>`).join('')}</tbody>
          </table>
        </div>
      `).join('')}
      <div class="score-summary-table" style="margin:1.25rem 0;">
        <table class="summary-table">
          <thead><tr><th>Komponen Penilaian</th><th>Nilai</th></tr></thead>
          <tbody>
            <tr><td>Nilai Wawancara (×0.6)</td><td class="skor-cell">${rataRata}</td></tr>
            <tr><td>Nilai Tes Tulis (×0.4)</td><td class="skor-cell">${tesSkor100 !== null ? tesSkor100 + '/100' : '-'}</td></tr>
            ${tesSkor100 !== null ? `<tr><td><strong>Nilai Akhir</strong></td><td class="skor-cell" style="font-size:1.1rem;"><strong>${skorAkhir}</strong></td></tr>` : ''}
          </tbody>
        </table>
      </div>
      <div class="summary-final">
        <div class="final-score">
          <span class="final-label">Skor Akhir</span>
          <span class="final-number">${tesSkor100 !== null ? skorAkhir : rataRata + ' *'}</span>
          <span class="final-category" style="background:${kategori?kategori.color:'#999'}">${kategori?kategori.label:'-'}</span>
          ${tesSkor100 === null ? '<br><span style="font-size:.75rem;color:var(--text-muted);">* Tanpa data tes tulis</span>' : ''}
        </div>
      </div>
      <div class="form-group" style="margin-top:1rem">
        <label for="catatan">Catatan Tambahan (opsional)</label>
        <textarea id="catatan" rows="3" placeholder="Tulis catatan tambahan tentang kandidat..."></textarea>
      </div>
    </div>
  `;
}

// ─── SUBMIT ────────────────────────────────────────────────────────────
let _submitting = false;

async function submitPenilaian() {
  if (_submitting) return;
  _submitting = true;

  const submitBtn = document.querySelector('.btn-submit');
  if (submitBtn) { submitBtn.disabled = true; submitBtn.textContent = '⏳ Menyimpan...'; }

  const all = [
    ...PERTANYAAN.map(q => scores[q.id] || 0),
    ...STUDI_KASUS.flatMap(sk => sk.aspek.map(a => scores[a.id] || 0))
  ];
  const rataRata = (all.reduce((a,b) => a+b, 0) / all.length).toFixed(1);
  const tesSkor100 = (_tesTulisData && _tesTulisData.nilai) ? parseFloat(_tesTulisData.nilai) : null;
  const skorAkhir = tesSkor100 !== null ? parseFloat(((parseFloat(rataRata) * 0.6) + ((tesSkor100 / 100) * 10 * 0.4)).toFixed(1)) : null;
  const kategori = KATEGORI.find(k => skorAkhir !== null ? (skorAkhir >= k.min && skorAkhir <= k.max) : (parseFloat(rataRata) >= k.min && parseFloat(rataRata) <= k.max));
  const nama = document.getElementById('nama').value.trim();

  try {
    // Check for duplicate before submitting
    const dupUrl = GAS_URL + '?action=checkDuplicate&nama=' + encodeURIComponent(nama);
    const dupResult = await fetch(dupUrl).then(r => r.json());

    if (dupResult.success && dupResult.duplicate) {
      const ex = dupResult.existing;
      const proceed = confirm(
        '⚠️ Kandidat "' + nama + '" sudah pernah dinilai sebelumnya.\n\n' +
        'Data sebelumnya:\n' +
        'Kelas: ' + ex.kelas + '\n' +
        'Divisi: ' + ex.divisi + '\n' +
        'Nilai Wawancara: ' + ex.rataRata + '\n' +
        'Skor Tes Tulis: ' + ex.skorTesTulis + '\n' +
        'Skor Akhir: ' + ex.skorAkhir + '\n\n' +
        'Tetap ingin menyimpan ulang?'
      );
      if (!proceed) {
        _submitting = false;
        if (submitBtn) { submitBtn.disabled = false; submitBtn.textContent = '✅ Simpan Penilaian'; }
        return;
      }
    }

    const payload = {
      action: 'submitPenilaian',
      nama:   nama,
      kelas:  document.getElementById('kelas').value,
      divisi: document.getElementById('divisi').value,
      skor:   Object.assign({}, scores),
      rataRata: parseFloat(rataRata),
      skorTesTulis: tesSkor100,
      skorAkhir: skorAkhir,
      kategori: kategori ? kategori.label : '-',
      catatan:  document.getElementById('catatan') ? document.getElementById('catatan').value : ''
    };

    await fetch(GAS_URL, {
      method: 'POST',
      mode: 'no-cors',
      body: JSON.stringify(payload)
    });
    clearCache();
    showToast('✅ Penilaian berhasil disimpan!');
    setTimeout(() => {
      if (confirm('Penilaian tersimpan. Ingin menilai kandidat berikutnya?')) {
        resetForm();
        goToStep(1);
      }
      _submitting = false;
      if (submitBtn) { submitBtn.disabled = false; submitBtn.textContent = '✅ Simpan Penilaian'; }
    }, 1000);
  } catch (err) {
    showToast('❌ Gagal menyimpan: ' + err.message);
    _submitting = false;
    if (submitBtn) { submitBtn.disabled = false; submitBtn.textContent = '✅ Simpan Penilaian'; }
  }
}

function resetForm() {
  document.getElementById('nama').value = '';
  document.getElementById('kelas').value = '';
  document.getElementById('divisi').value = '';
  const ct = document.getElementById('catatan');
  if (ct) ct.value = '';
  Object.keys(scores).forEach(k => delete scores[k]);
  _tesTulisData = null;
  document.querySelectorAll('.score-btn.active').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.skor-display').forEach(d => { d.textContent = '-'; d.classList.remove('show'); });
  // Hide panels
  const box = document.getElementById('registration-reference');
  if (box) box.hidden = true;
  const tesBox = document.getElementById('tes-tulis-info');
  if (tesBox) tesBox.hidden = true;
}

// ─── RUBRIK MODAL ──────────────────────────────────────────────────────
function showRubrik() {
  document.getElementById('rubrik-body').innerHTML = `
    <table class="rubrik-table">
      <thead><tr><th>Skor</th><th>Deskripsi</th></tr></thead>
      <tbody>${RUBRIK_SKOR.map(r => `<tr><td class="rubrik-skor">${r.skor}</td><td>${r.label}</td></tr>`).join('')}</tbody>
    </table>
  `;
  document.getElementById('rubrik-modal').classList.add('open');
}

function closeModal(e) {
  if (!e || e.target === document.getElementById('rubrik-modal')) {
    document.getElementById('rubrik-modal').classList.remove('open');
  }
}

// ─── TOAST ─────────────────────────────────────────────────────────────
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3500);
}
</script>
